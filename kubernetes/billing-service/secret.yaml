apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secret
  namespace: healthcare
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:billing_secure_password@billing-postgres.healthcare.svc.cluster.local:5432/billing_db"
  JWT_SECRET: "your-super-secret-jwt-key-change-this-in-production"
  JWT_ALGORITHM: "HS256"
  RABBITMQ_URL: "amqp://admin:rabbitmq_secure_password@rabbitmq.healthcare.svc.cluster.local:5672/"
  REDIS_PASSWORD: "redis_secure_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: billing-postgres-secret
  namespace: healthcare
type: Opaque
stringData:
  POSTGRES_PASSWORD: "billing_secure_password"
