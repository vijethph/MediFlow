apiVersion: v1
kind: Secret
metadata:
  name: appointment-service-secret
  namespace: healthcare
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://postgres:appointment_secure_password@appointment-postgres.healthcare.svc.cluster.local:5432/appointment_db"
  JWT_SECRET: "your-super-secret-jwt-key-change-this-in-production"
  JWT_ALGORITHM: "HS256"
  RABBITMQ_URL: "amqp://admin:rabbitmq_secure_password@rabbitmq.healthcare.svc.cluster.local:5672/"
  REDIS_PASSWORD: "redis_secure_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: appointment-postgres-secret
  namespace: healthcare
type: Opaque
stringData:
  POSTGRES_PASSWORD: "appointment_secure_password"

