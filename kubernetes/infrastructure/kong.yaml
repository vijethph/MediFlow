                config:
                  replace:
                    uri: /redoc
          - name: billing-route-openapi
            paths:
              - ~/billing/openapi.json$
            strip_path: false
            protocols:
              - http
              - https
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /openapi.json
          - name: billing-route-health
            paths:
              - ~/billing/health$
            strip_path: false
            protocols:
              - http
