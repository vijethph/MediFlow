apiVersion: v1
kind: Namespace
metadata:
  name: kong
  labels:
    name: kong
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: kong
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
  selector:
    app: kong
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: kong
spec:
  type: ClusterIP
  ports:
    - name: admin
      port: 8001
      targetPort: 8001
      protocol: TCP
  selector:
    app: kong
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong:3.3.1-alpine
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: "/kong/declarative/kong.yml"
            - name: KONG_PROXY_ACCESS_LOG
              value: "/dev/stdout"
            - name: KONG_ADMIN_ACCESS_LOG
              value: "/dev/stdout"
            - name: KONG_PROXY_ERROR_LOG
              value: "/dev/stderr"
            - name: KONG_ADMIN_ERROR_LOG
              value: "/dev/stderr"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
            - name: KONG_NGINX_WORKER_PROCESSES
              value: "1"
            - name: KONG_MEM_CACHE_SIZE
              value: "64m"
          ports:
            - name: proxy
              containerPort: 8000
              protocol: TCP
            - name: proxy-ssl
              containerPort: 8443
              protocol: TCP
            - name: admin
              containerPort: 8001
              protocol: TCP
          volumeMounts:
            - name: kong-config
              mountPath: /kong/declarative
          livenessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: kong
data:
  kong.yml: |
    _format_version: "3.0"

    services:
      # Patient Service
      - name: patient-service
        url: http://patient-service.healthcare.svc.cluster.local:8001
        routes:
          - name: patient-route-api
            paths:
              - /api/v1/patients
              - /api/v1/auth
            strip_path: false
            protocols:
              - http
              - https
          - name: patient-route-docs
            paths:
              - ~/patient/docs$
            strip_path: false
            protocols:
              - http
              - https
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /docs
          - name: patient-route-redoc
            paths:
              - ~/patient/redoc$
            strip_path: false
            protocols:
              - http
              - https
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /redoc
          - name: patient-route-openapi
            paths:
              - ~/patient/openapi.json$
            strip_path: false
            protocols:
              - http
              - https
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /openapi.json
          - name: patient-route-health
            paths:
              - ~/patient/health$
            strip_path: false
            protocols:
              - http
              - https
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /health

      # Appointment Service
      - name: appointment-service
        url: http://appointment-service.healthcare.svc.cluster.local:8002
        routes:
          - name: appointment-route-api
            paths:
              - /api/v1/appointments
              - /api/v1/schedules
            strip_path: false
            protocols:
              - http
              - https
          - name: appointment-route-docs
            paths:
              - ~/appointment/docs$
            strip_path: false
            protocols:
              - http
              - https
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /docs
          - name: appointment-route-redoc
            paths:
              - ~/appointment/redoc$
            strip_path: false
            protocols:
              - http
              - https
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /redoc
          - name: appointment-route-openapi
            paths:
              - ~/appointment/openapi.json$
            strip_path: false
            protocols:
              - http
              - https
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /openapi.json
          - name: appointment-route-health
            paths:
              - ~/appointment/health$
            strip_path: false
            protocols:
              - http
              - https
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /health

      # Prescription Service
      - name: prescription-service
        url: http://prescription-service.healthcare.svc.cluster.local:8003
        routes:
          - name: prescription-route-api
            paths:
              - /api/v1/prescriptions
              - /api/v1/medical-records
              - /api/v1/lab-results
            strip_path: false
            protocols:
              - http
              - https
          - name: prescription-route-docs
            paths:
              - ~/prescription/docs$
            strip_path: false
            protocols:
              - http
              - https
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /docs
          - name: prescription-route-redoc
            paths:
              - ~/prescription/redoc$
            strip_path: false
            protocols:
              - http
              - https
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /redoc
          - name: prescription-route-openapi
            paths:
              - ~/prescription/openapi.json$
            strip_path: false
            protocols:
              - http
              - https
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /openapi.json
          - name: prescription-route-health
            paths:
              - ~/prescription/health$
            strip_path: false
            protocols:
              - http
              - https
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /health

      # Billing Service
      - name: billing-service
        url: http://billing-service.healthcare.svc.cluster.local:8004
        routes:
          - name: billing-route-api
            paths:
              - /api/v1/invoices
              - /api/v1/payments
              - /api/v1/claims
              - /api/v1/reports
            strip_path: false
            protocols:
              - http
              - https
          - name: billing-route-docs
            paths:
              - ~/billing/docs$
            strip_path: false
