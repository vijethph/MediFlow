apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: patient-postgres-pvc
  namespace: healthcare
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-postgres
  namespace: healthcare
  labels:
    app: patient-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-postgres
  template:
    metadata:
      labels:
        app: patient-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: "patient_db"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patient-postgres-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: patient-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: patient-postgres
  namespace: healthcare
spec:
  selector:
    app: patient-postgres
  ports:
    - port: 5432
      targetPort: 5432
