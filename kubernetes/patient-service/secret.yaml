apiVersion: v1
kind: Secret
metadata:
  name: patient-service-secret
  namespace: healthcare
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://postgres:patient_secure_password@patient-postgres.healthcare.svc.cluster.local:5432/patient_db"
  JWT_SECRET: "your-super-secret-jwt-key-change-this-in-production"
  JWT_ALGORITHM: "HS256"
  RABBITMQ_URL: "amqp://admin:rabbitmq_secure_password@rabbitmq.healthcare.svc.cluster.local:5672/"
  REDIS_PASSWORD: "redis_secure_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: patient-postgres-secret
  namespace: healthcare
type: Opaque
stringData:
  POSTGRES_PASSWORD: "patient_secure_password"
