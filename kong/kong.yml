# Kong Declarative Configuration for Healthcare Patient Management System
# Format Version: 3.0
# This configuration defines routes, services, and plugins for the API Gateway

_format_version: "3.0"

# ============================================================================
# SERVICES & ROUTES
# ============================================================================

services:
  # Patient Service
  - name: patient-service
    url: http://patient-service:8001
    tags:
      - patient
      - healthcare
    routes:
      - name: patient-api
        paths:
          - /api/v1/patients
          - /api/v1/auth
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
      - name: patient-docs
        paths:
          - ~/patient/docs$
        strip_path: false
        methods:
          - GET
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /docs
      - name: patient-redoc
        paths:
          - ~/patient/redoc$
        strip_path: false
        methods:
          - GET
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /redoc
      - name: patient-openapi
        paths:
          - ~/patient/openapi.json$
        strip_path: false
        methods:
          - GET
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /openapi.json
      - name: patient-health
        paths:
          - ~/patient/health$
        strip_path: false
        methods:
          - GET
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /health

  # Appointment Service
