# ============================================================================
# GLOBAL PLUGINS
# ============================================================================

plugins:
  # Request ID (for distributed tracing)
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid#counter
      echo_downstream: true

  # CORS (for frontend integration)
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
      exposed_headers:
        - X-Request-ID
      credentials: true
      max_age: 3600
