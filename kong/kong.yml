# ============================================================================
# CONSUMERS & CREDENTIALS (JWT Configuration)
# ============================================================================

# Consumers represent authenticated users or services
# JWT credentials will be managed by Patient Service auth module

consumers:
  # System/Internal Service Consumer
  - username: system-internal
    custom_id: system-001
    tags:
      - internal
      - system

  # Example Patient Consumer (for testing)
  - username: test-patient
    custom_id: patient-test-001
    tags:
      - patient
      - test

  # Example Doctor Consumer (for testing)
  - username: test-doctor
    custom_id: doctor-test-001
    tags:
      - doctor
      - test

  # Example Admin Consumer (for testing)
  - username: test-admin
    custom_id: admin-test-001
    tags:
      - admin
      - test
# ============================================================================
# NOTES
# ============================================================================

# 1. JWT Authentication:
#    - JWT tokens are issued by Patient Service
#    - Kong validates the token signature using the JWT_SECRET
#    - Token must include: sub, email, role, patient_id, exp
#
# 2. Rate Limiting:
#    - 100 requests per minute per client IP
#    - 1000 requests per hour per client IP
#    - Can be adjusted based on load testing results
#
# 3. Service URLs:
#    - Internal Docker network: http://<service-name>:<port>
#    - Kong proxy: http://localhost:8000/api/v1/<resource>
#
# 4. Health Checks:
#    - All services must expose /health endpoint
#    - Kong will not route to unhealthy services
#
# 5. Future Enhancements:
#    - OAuth2 plugin for more complex auth flows
#    - Redis-based rate limiting for distributed environments
#    - Advanced load balancing with circuit breakers
#    - mTLS for service-to-service communication
