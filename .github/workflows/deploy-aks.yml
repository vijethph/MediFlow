name: Deploy to Azure AKS

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/mediflow
  AKS_NAMESPACE: mediflow

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure Components
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER_NAME }}

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.AKS_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy infrastructure components
        run: |
          # Deploy namespace
          kubectl apply -f kubernetes/namespace.yaml

          # Deploy infrastructure (databases, redis, rabbitmq)
          kubectl apply -f kubernetes/infrastructure/

      - name: Wait for infrastructure to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=postgres-patient -n ${{ env.AKS_NAMESPACE }} --timeout=300s
          kubectl wait --for=condition=ready pod -l app=postgres-appointment -n ${{ env.AKS_NAMESPACE }} --timeout=300s
          kubectl wait --for=condition=ready pod -l app=postgres-billing -n ${{ env.AKS_NAMESPACE }} --timeout=300s
          kubectl wait --for=condition=ready pod -l app=mongodb -n ${{ env.AKS_NAMESPACE }} --timeout=300s
          kubectl wait --for=condition=ready pod -l app=redis -n ${{ env.AKS_NAMESPACE }} --timeout=300s
          kubectl wait --for=condition=ready pod -l app=rabbitmq -n ${{ env.AKS_NAMESPACE }} --timeout=300s

  deploy-services:
    name: Deploy Microservices
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    environment: ${{ github.event.inputs.environment || 'staging' }}

    strategy:
      matrix:
        service:
          [
            patient-service,
            appointment-service,
            prescription-service,
            billing-service,
          ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER_NAME }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in manifests
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          sed -i "s|image: .*${{ matrix.service }}.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:main-${IMAGE_TAG}|g" kubernetes/${{ matrix.service }}/${{ matrix.service }}-deployment.yaml

      - name: Deploy ${{ matrix.service }}
        run: |
          kubectl apply -f kubernetes/${{ matrix.service }}/

      - name: Wait for ${{ matrix.service }} to be ready
        run: |
          kubectl rollout status deployment/${{ matrix.service }} -n ${{ env.AKS_NAMESPACE }} --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.AKS_NAMESPACE }} -l app=${{ matrix.service }}
          kubectl get svc -n ${{ env.AKS_NAMESPACE }} -l app=${{ matrix.service }}

  deploy-monitoring:
    name: Deploy Monitoring Stack
    runs-on: ubuntu-latest
    needs: deploy-services
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER_NAME }}

      - name: Create monitoring namespace
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Prometheus
        run: |
          kubectl apply -f monitoring/prometheus/ -n monitoring

      - name: Deploy Grafana
        run: |
          kubectl apply -f monitoring/grafana/ -n monitoring

      - name: Wait for monitoring to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=prometheus -n monitoring --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=grafana -n monitoring --timeout=300s || true

  health-check:
    name: Health Check All Services
    runs-on: ubuntu-latest
    needs: [deploy-services, deploy-monitoring]
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER_NAME }}

      - name: Check all pods status
        run: |
          echo "=== Pods in ${{ env.AKS_NAMESPACE }} namespace ==="
          kubectl get pods -n ${{ env.AKS_NAMESPACE }}

          echo "=== Services in ${{ env.AKS_NAMESPACE }} namespace ==="
          kubectl get svc -n ${{ env.AKS_NAMESPACE }}

          echo "=== Pods in monitoring namespace ==="
          kubectl get pods -n monitoring

      - name: Health check - Patient Service
        run: |
          kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never -n ${{ env.AKS_NAMESPACE }} -- \
            curl -f http://patient-service:8001/health || echo "Patient service health check failed"
        continue-on-error: true

      - name: Health check - Appointment Service
        run: |
          kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never -n ${{ env.AKS_NAMESPACE }} -- \
            curl -f http://appointment-service:8002/health || echo "Appointment service health check failed"
        continue-on-error: true

      - name: Health check - Prescription Service
        run: |
          kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never -n ${{ env.AKS_NAMESPACE }} -- \
            curl -f http://prescription-service:8003/health || echo "Prescription service health check failed"
        continue-on-error: true

      - name: Health check - Billing Service
        run: |
          kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never -n ${{ env.AKS_NAMESPACE }} -- \
            curl -f http://billing-service:8004/health || echo "Billing service health check failed"
        continue-on-error: true

      - name: Display deployment summary
        run: |
          echo "=== Deployment Summary ==="
          echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
          echo "Commit: ${GITHUB_SHA::7}"
          echo "Branch: ${GITHUB_REF#refs/heads/}"
          echo "=========================="
          kubectl get deployments -n ${{ env.AKS_NAMESPACE }}
