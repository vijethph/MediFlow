          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies
        run: |
          pipenv install --dev --system

      - name: Run prescription service tests
        env:
          MONGO_URL: mongodb://admin:mongo_secure_password@localhost:27017/prescription_test_db?authSource=admin
          MONGO_DATABASE: prescription_test_db
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          JWT_SECRET: test-secret-key-for-ci
