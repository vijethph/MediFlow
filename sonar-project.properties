# SonarCloud Configuration for MediFlow
# Multi-module Python microservices project

sonar.projectKey=mediflow
sonar.organization=acme-corporation

# Project Information
sonar.projectName=MediFlow
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=services,common
sonar.tests=tests

# Exclusions
sonar.exclusions=**/tests/**,**/node_modules/**,**/client/**,**/__pycache__/**,**/venv/**,**/.venv/**,**/Pipfile.lock,**/migrations/**,**/*.pyc

# Test exclusions
sonar.test.exclusions=**/tests/**

# Python specific settings
sonar.python.version=3.11

# Coverage reports (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage-patient.xml,coverage-appointment.xml,coverage-prescription.xml,coverage-billing.xml
sonar.sourceEncoding=UTF-8
sonar.modules=patient-service,appointment-service,prescription-service,billing-service,common

# Patient Service Module
patient-service.sonar.projectName=Patient Service
patient-service.sonar.sources=services/patient-service
patient-service.sonar.tests=tests/patient
patient-service.sonar.python.coverage.reportPaths=coverage-patient.xml

# Appointment Service Module
appointment-service.sonar.projectName=Appointment Service
appointment-service.sonar.sources=services/appointment-service
appointment-service.sonar.tests=tests/appointment
appointment-service.sonar.python.coverage.reportPaths=coverage-appointment.xml

# Prescription Service Module
prescription-service.sonar.projectName=Prescription Service
prescription-service.sonar.sources=services/prescription-service
prescription-service.sonar.tests=tests/prescription
prescription-service.sonar.python.coverage.reportPaths=coverage-prescription.xml

# Billing Service Module
billing-service.sonar.projectName=Billing Service
billing-service.sonar.sources=services/billing-service
billing-service.sonar.tests=tests/billing
billing-service.sonar.python.coverage.reportPaths=coverage-billing.xml

# Common Module (Shared Code)
common.sonar.projectName=Common Shared Library
common.sonar.sources=common
common.sonar.tests=

sonar.cpd.python.minimumTokens=100
sonar.qualitygate.wait=true
