# SonarCloud Configuration for MediFlow
# Python microservices project

sonar.projectKey=vijethph_MediFlow
sonar.organization=acme-corporation

# Project Information
sonar.projectName=MediFlow
sonar.projectVersion=1.0.0

# Source and test directories (relative to project root)
sonar.sources=services,common
sonar.tests=tests

# Exclusions
sonar.exclusions=**/tests/**,**/node_modules/**,**/client/**,**/__pycache__/**,**/venv/**,**/.venv/**,**/Pipfile.lock,**/migrations/**,**/*.pyc,**/conftest.py

# Test exclusions
sonar.test.exclusions=**/tests/**

# Python specific settings
sonar.python.version=3.11

# Coverage reports (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage-patient.xml,coverage-appointment.xml,coverage-prescription.xml,coverage-billing.xml
sonar.sourceEncoding=UTF-8

# Code duplication
sonar.cpd.python.minimumTokens=100

# Quality gate
sonar.qualitygate.wait=true
